name: CI / Deploy to Netlify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: VITE_EAGER_IMPORTS=true npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  deploy:
    name: Deploy to Netlify
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # Requires repository secrets:
      #   NETLIFY_AUTH_TOKEN - personal access token from Netlify
      #   NETLIFY_SITE_ID    - site ID from Netlify (Site configuration -> General -> Site ID)
      - name: Validate Netlify credentials
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          set -euo pipefail

          if [ -z "${NETLIFY_AUTH_TOKEN:-}" ]; then
            echo "::error::Secret NETLIFY_AUTH_TOKEN is not set. Add it in Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          if [ -z "${NETLIFY_SITE_ID:-}" ]; then
            echo "::error::Secret NETLIFY_SITE_ID is not set. Add it in Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          user_status=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
            https://api.netlify.com/api/v1/user)

          if [ "$user_status" != "200" ]; then
            echo "::error::Netlify token is invalid or expired (HTTP $user_status). Create a new personal access token in Netlify: User settings -> Applications -> Personal access tokens."
            exit 1
          fi

          site_status=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
            "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID")

          if [ "$site_status" != "200" ]; then
            echo "::error::Netlify site is not accessible with this token (HTTP $site_status). Check NETLIFY_SITE_ID: Site configuration -> General -> Site ID."
            exit 1
          fi

          echo "Netlify credentials are valid."

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v4.0.0
        with:
          publish-dir: ./dist
          production-branch: main
          production-deploy: true
          deploy-message: "Deploy from GitHub Actions commit ${{ github.sha }}"
          enable-pull-request-comment: false
          enable-commit-comment: false
          enable-commit-status: false
          enable-github-deployment: false
          fails-without-credentials: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
